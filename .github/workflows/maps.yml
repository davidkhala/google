name: Google maps
on:
  push:

env:
  API_KEY: ${{secrets.API_KEY}}
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps/node
    steps:
      - uses: actions/setup-node@main
        with:
          check-latest: true
          node-version: lts/*
      - uses: actions/checkout@main
      - run: npm install
      - run: npm test
  py:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@main
     - uses: davidkhala/uv-buildpack@main
       with:
         working-directory: maps/py
         tests: maps/py/tests
         test-entry-point: pytest
